<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nexus-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- Indigo 600 -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- Cyan 500 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="url(#nexus-gradient)" />
  
  <!-- The 'N' path -->
  <path 
    d="M28 72V28L72 72V28" 
    stroke="white" 
    stroke-width="10" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Glowing Nodes -->
  <circle cx="28" cy="28" r="6" fill="#ffffff" filter="url(#glow)" />
  <circle cx="72" cy="72" r="6" fill="#ffffff" filter="url(#glow)" />
  <circle cx="28" cy="72" r="6" fill="#ffffff" filter="url(#glow)" />
  <circle cx="72" cy="28" r="6" fill="#ffffff" filter="url(#glow)" />
</svg>
